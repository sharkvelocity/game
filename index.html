<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn-based ghost investigation horror game" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      color: #eee;
      font-family: monospace, sans-serif;
      overflow: hidden;
    }
    #title-screen, #loadout-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #loadout-screen {
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    #main-ui, #main-scene, #fog, #notebook, #inventory-overlay, #van-monitor, #game-log {
      position: absolute;
    }
    #main-scene, #fog {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-size: cover;
      background-position: center;
    }
    #main-ui {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.75);
      padding: 12px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #command-buttons {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 100;
      display: none;
    }
    #notebook, #inventory-overlay {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      color: #0f0;
      padding: 16px;
      border: 2px solid #0f0;
      z-index: 5000;
      display: none;
    }
    #van-monitor {
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #0f0;
      font-size: 16px;
      z-index: 9999;
      display: none;
    }
    .log-box {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 25vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.75);
      padding: 8px;
      z-index: 200;
      font-size: 14px;
    }
    button {
      font-family: monospace;
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover {
      background: #0f0;
      color: #000;
    }
    .btn-danger {
      background: #900;
      color: white;
      font-weight: bold;
    }
    .btn-danger:hover {
      background: #f00;
    }
  </style>
</head>
<body>
  <div id="title-screen">
    <button id="startButton">Start New Investigation</button>
  </div>
  <div id="loadout-screen">
    <h3>Choose Your Loadout</h3>
    <button id="confirm-loadout">Confirm Loadout</button>
  </div>
  <div id="main-ui">
    <div id="main-scene"></div>
    <canvas id="fog"></canvas>
    <div id="hud">
      <button id="notebook-btn">Open Notebook</button>
      <button id="inventory-btn">Check Inventory</button>
      <button id="reset-btn" class="btn-danger">Reset Investigation</button>
      <div id="hud-location"></div>
      <div id="hud-turn"></div>
      <div id="hud-sanity"></div>
      <div id="hud-temp" style="display:none;"></div>
    </div>
    <div id="command-buttons">
      <button data-cmd="move">Move</button>
      <button data-cmd="look">Look Around</button>
      <button data-cmd="inventory">Check Inventory</button>
      <button data-cmd="guess">Ghost Guess</button>
      <button data-cmd="van">Return to Van</button>
    </div>
    <div id="notebook">
      <h3>Evidence Notebook</h3>
      <ul id="notebook-entries"></ul>
    </div>
    <div id="inventory-overlay">
      <h3>Held Items</h3>
      <ul id="inventory-list"></ul>
    </div>
    <div id="van-monitor"></div>
    <div id="game-log" class="log-box"></div>
  </div>
  <script type="module">
    import { startInvestigation } from './js/main.js';
    import { showLoadout } from './js/ui.js';
    import { resetGame } from './js/state.js';

    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.getElementById('startButton');
      const confirmBtn = document.getElementById('confirm-loadout');

      if (startBtn) {
        startBtn.addEventListener('click', () => {
          document.getElementById('title-screen').style.display = 'none';
          document.getElementById('loadout-screen').style.display = 'flex';
          showLoadout();
        });
      }

      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          const confirmEvent = new CustomEvent('confirm-loadout');
          document.dispatchEvent(confirmEvent);
        });
      }

      const resetBtn = document.getElementById('reset-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          if (confirm("Reset all progress?")) {
            localStorage.clear();
            sessionStorage.clear();
            resetGame();
            location.reload();
          }
        });
      }

      const cmdWrap = document.getElementById('command-buttons');
      if (cmdWrap) {
        cmdWrap.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-cmd]');
          if (!btn) return;
          const cmd = btn.dataset.cmd;
          document.dispatchEvent(new CustomEvent('ui-command', { detail: cmd }));
        });
      }

      document.addEventListener('confirm-loadout', () => {
        import('./js/main.js').then(mod => {
          mod.default?.confirmLoadout?.();
          setTimeout(() => mod.startInvestigation?.(true), 100);
        });
      });
    });
  </script>
</body>
</html>
