<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn-based ghost investigation horror game" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      color: #eee;
      font-family: monospace, sans-serif;
      overflow: hidden;
    }

    #main-ui {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #fog {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px;
      border: 1px solid #444;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #notebook,
    #inventory-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      color: #0f0;
      padding: 16px;
      border: 2px solid #0f0;
      z-index: 5000;
      min-width: 240px;
      max-height: 60vh;
      overflow-y: auto;
      display: none;
    }

    #notebook h3,
    #inventory-overlay h3 {
      margin-top: 0;
      text-align: center;
    }

    #inventory-list {
      list-style: none;
      padding-left: 0;
    }

    #inventory-list li {
      padding: 4px 0;
    }

    #van-monitor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 16px;
      z-index: 9999;
      padding: 20px;
      white-space: pre-wrap;
    }

    button {
      font-family: monospace;
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover {
      background: #0f0;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="main-ui">
    <canvas id="fog"></canvas>

    <div id="hud">
      <button id="start-btn">Start Game</button>
      <button id="notebook-btn">Open Notebook</button>
      <button id="inventory-btn">Check Inventory</button>
    </div>

    <div id="notebook">
      <h3>Evidence Notebook</h3>
      <ul>
        <li>Ghost Writing</li>
        <li>Freezing Temps</li>
        <li>EMF 5</li>
      </ul>
    </div>

    <div id="inventory-overlay">
      <h3>Held Items</h3>
      <ul id="inventory-list"></ul>
    </div>
  </div>
<!-- Notebook Toggle -->
<div id="notebook" style="display:none;"></div>

<!-- Inventory Overlay -->
<div id="inventory-overlay" style="display:none;">
  <ul id="inventory-list"></ul>
</div>

<!-- HUD Elements -->
<div id="hud">
  <div id="hud-location"></div>
  <div id="hud-turn"></div>
  <div id="hud-sanity"></div>
  <div id="hud-temp" style="display:none;"></div>
</div>

<!-- Log Output -->
<div id="game-log" class="log-box"></div>

<!-- Main Scene Background -->
<div id="main-scene"></div>

  <!-- Module Scripts -->
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/audioManager.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/items.js"></script>
  <script type="module" src="js/events.js"></script>
  <script type="module" src="js/ghostBehavior.js"></script>
  <script type="module" src="js/fog.js"></script>
  <script type="module" src="js/vanMonitor.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
