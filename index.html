<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phasma‑Phoney v2.9 — Modular Master Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Phasma‑Phoney: Turn-based ghost investigation horror with 25 ghosts, mimic logic, cursed items, full hunt system, and save/restore.">
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: black; color: #eee;
      font-family: monospace, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    button {
      min-width: 60px; min-height: 30px;
      padding: calc(4px + 0.4vw) calc(6px + 0.6vw);
      border-radius: 4px;
    }

    /* === TITLE SCREEN === */
    #title-screen {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: #000; z-index: 1000; opacity: 1;
      transition: opacity 1.5s ease;
    }
    #title-screen img {
      max-width: 70%;
      animation: pulse 5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% {opacity: 0.9; transform: scale(1);}
      50% {opacity: 1; transform: scale(1.04);}
    }
    #start-button, #loadGameButton {
      position: absolute; left: 50%;
      transform: translateX(-50%);
      font-size: calc(12px + 1vw);
      background: #111; color: #eee;
      border: 2px solid #444; cursor: pointer;
      transition: all 0.3s ease;
    }
    #start-button {bottom: 20%;}
    #loadGameButton {bottom: 10%;}
    #start-button:hover, #loadGameButton:hover {
      background: #222; border-color: #888;
    }

    /* === MAIN SCENE === */
    #main-scene {
      position: relative;
      width: 100vw; height: calc(100vh - 30px);
      overflow: hidden; background: black;
      display: none;
    }
    #background, #lightning, #fog-layer, #orbCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #background {z-index: 1; background-size: cover; background-position: center;}
    #lightning {z-index: 3; background: white; opacity: 0; pointer-events: none;}
    #fog-layer {z-index: 4; pointer-events: none;}
    #orbCanvas {z-index: 5; pointer-events: none;}

    /* === HUD === */
    #hud {
      position: absolute; top: 1%; left: 1%;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.6em 0.8em;
      border: 1px solid #444;
      font-size: calc(10px + 0.5vw);
      z-index: 10; max-width: 45%; word-wrap: break-word;
    }
    #sanity-bar-container {
      width: calc(60px + 5vw); height: 10px;
      background: #222; border: 1px solid #555;
      margin-top: 4px; position: relative;
    }
    #sanity-bar {
      position: absolute; top: 0; left: 0;
      height: 100%; background: #0f0; width: 100%;
      transition: width 0.3s ease;
    }
    #inventory-display {
      position: absolute; top: 1%; right: 1%;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.4em 0.6em;
      border: 1px solid #444;
      font-size: calc(9px + 0.4vw);
      z-index: 10; max-width: 40%; word-wrap: break-word;
    }

    /* === NARRATOR UI === */
    #narrator-ui {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 40%;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      padding-bottom: 32px;
      min-height: 40%;
    }
    #game-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: calc(9px + 0.5vw);
      line-height: 1.4;
      max-height: 65%;
      min-height: 60px;
    }
    .log-entry {opacity: 0.85; transition: opacity 1s ease-in-out;}
    .log-entry.fade {opacity: 0.4;}

    #command-buttons {
      display: flex; flex-wrap: wrap;
      justify-content: space-around;
      padding: 0.5em;
      border-top: 1px solid #555;
      background: rgba(0, 0, 0, 0.5);
      margin-top: auto;
      margin-bottom: 32px;
      min-height: 40px;
    }
    #command-buttons button {
      flex: 1 1 18%;
      margin: 0.2em;
      font-size: calc(9px + 0.5vw);
      background: #222; color: #eee;
      border: 1px solid #555; cursor: pointer;
    }
    #command-buttons button:hover {background: #333;}

    /* === FOOTER === */
    footer {
      position: fixed; bottom: 0;
      width: 100%; text-align: center;
      background: #111; color: #aaa;
      font-size: calc(7px + 0.3vw);
      padding: 4px 0; border-top: 1px solid #333;
      z-index: 3500;
    }
    footer strong {color: #eee;}
  </style>
</head>
<body>
  <!-- === TITLE SCREEN === -->
  <div id="title-screen">
    <img src="logo.png" alt="Phasma-Phoney Logo">
    <button id="start-button">Start New Game</button>
    <button id="loadGameButton">Load Game</button>
  </div>

  <!-- === MAIN SCENE === -->
  <div id="main-scene">
    <div id="background"></div>
    <div id="lightning"></div>
    <canvas id="fog-layer"></canvas>
    <canvas id="orbCanvas"></canvas>

    <div id="hud">
      <div>Location: <span id="hud-location">Van</span> | Weather: <span id="hud-weather">--</span></div>
      <div>Turns: <span id="hud-turns">0</span></div>
      <div>Sanity:</div>
      <div id="sanity-bar-container"><div id="sanity-bar"></div></div>
      <div>Temp: <span id="hud-temp">--°C</span></div>
    </div>

    <div id="inventory-display"><div>Held:</div><div id="held-items-display">None</div></div>

    <div id="narrator-ui">
      <div id="game-log"></div>
      <div id="command-buttons"></div>
    </div>
  </div>

  <!-- === FOOTER === -->
  <footer>
    <div><strong>Phasma‑Phoney v2.9</strong> — Modular Master Build</div>
  </footer>

  <!-- === MODULE SCRIPTS === -->
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/map.js"></script>
  <script type="module" src="js/items.js"></script>
  <script type="module" src="js/audioManager.js"></script>
  <script type="module" src="js/events.js"></script>
  <script type="module" src="js/ghostBehavior.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
