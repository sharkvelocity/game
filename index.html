<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn-based ghost investigation horror game" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      color: #eee;
      font-family: monospace, sans-serif;
      overflow: hidden;
    }

    #main-ui {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #main-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-size: cover;
      background-position: center;
    }

    #fog {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px;
      border: 1px solid #444;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #notebook,
    #inventory-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      color: #0f0;
      padding: 16px;
      border: 2px solid #0f0;
      z-index: 5000;
      min-width: 240px;
      max-height: 60vh;
      overflow-y: auto;
      display: none;
    }

    #notebook h3,
    #inventory-overlay h3 {
      margin-top: 0;
      text-align: center;
    }

    #inventory-list {
      list-style: none;
      padding-left: 0;
    }

    #inventory-list li {
      padding: 4px 0;
    }

    #van-monitor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 16px;
      z-index: 9999;
      padding: 20px;
      white-space: pre-wrap;
    }

    button {
      font-family: monospace;
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover {
      background: #0f0;
      color: #000;
    }

    .btn-danger {
      background: #900;
      color: white;
      font-weight: bold;
    }

    .btn-danger:hover {
      background: #f00;
      color: white;
    }

    .log-box {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 25vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.75);
      padding: 8px;
      z-index: 200;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="main-ui">
  <div id="main-scene"></div>
  <canvas id="fog"></canvas>

  <div id="hud">
    <button id="start-btn">Start Game</button>
    <button id="notebook-btn">Open Notebook</button>
    <button id="inventory-btn">Check Inventory</button>
    <button id="reset-btn" class="btn-danger">Reset Investigation</button>
    <div id="hud-location"></div>
    <div id="hud-turn"></div>
    <div id="hud-sanity"></div>
    <div id="hud-temp" style="display:none;"></div>
  </div>

  <div id="notebook">
    <h3>Evidence Notebook</h3>
    <ul id="notebook-entries">
      <!-- Evidence entries will be populated dynamically -->
    </ul>
  </div>

  <div id="inventory-overlay">
    <h3>Held Items</h3>
    <ul id="inventory-list"></ul>
  </div>

  <div id="game-log" class="log-box"></div>
</div>
<script type="module">
  import { startInvestigation } from './main.js';
  import { showLoadout } from './ui.js';

  document.addEventListener('DOMContentLoaded', () => {
    // === START BUTTON (Title Screen) ===
    const startBtn = document.getElementById('startButton');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('loadout-screen').style.display = 'flex';
        showLoadout();
      });
    }

    // === CONFIRM LOADOUT ===
    const confirmBtn = document.getElementById('confirm-loadout');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        const confirmEvent = new CustomEvent('confirm-loadout');
        document.dispatchEvent(confirmEvent);
      });
    }

    // === COMMAND BUTTONS (Move, Look, Inventory, etc.) ===
    const cmdWrap = document.getElementById('command-buttons');
    if (cmdWrap) {
      cmdWrap.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-cmd]');
        if (!btn) return;
        const cmd = btn.dataset.cmd;
        if (!cmd) return;
        const cmdEvent = new CustomEvent('ui-command', {
          detail: cmd
        });
        document.dispatchEvent(cmdEvent);
      });
    }

    // === CLEAR SAVE BUTTON (Debug/Test) ===
    const resetBtn = document.getElementById('reset-save');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (window.clearGameSave) window.clearGameSave();
      });
    }
  });

  // === Loadout Confirm Trigger Integration ===
  document.addEventListener('confirm-loadout', () => {
    import('./main.js').then(mod => {
      mod.default?.confirmLoadout?.(); // Optional fallback
      setTimeout(() => {
        mod.startInvestigation?.(true);
      }, 100);
    });
  });
  
  import { resetGame } from './js/state.js';

  document.getElementById("reset-btn").addEventListener("click", () => {
    if (confirm("Are you sure you want to reset everything?")) {
      localStorage.clear();
      sessionStorage.clear();
      if (typeof resetGame === "function") resetGame();
      location.reload();
    }
  });
</script>

<script type="module" src="js/state.js"></script>
<script type="module" src="js/audioManager.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/items.js"></script>
<script type="module" src="js/events.js"></script>
<script type="module" src="js/ghostBehavior.js"></script>
<script type="module" src="js/fog.js"></script>
<script type="module" src="js/vanMonitor.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
